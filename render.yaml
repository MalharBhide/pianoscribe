# One-click Render deploy: https://render.com/docs/blueprint-spec
# Single web service running API + worker in one container on one disk.
# (Render disks cannot be shared between services, so a separate worker
# service would never see the API's jobs. See scripts/start_all.sh.)
services:
  - type: web
    name: piano-scribe
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: ./scripts/start_all.sh
    plan: standard
    healthCheckPath: /health
    disk:
      name: piano-scribe-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PIANO_SCRIBE_LOG_LEVEL
        value: INFO
      - key: PIANO_SCRIBE_MAX_UPLOAD_MB
        value: 50
      - key: PIANO_SCRIBE_MAX_DURATION_SEC
        value: 1800
