services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PIANO_SCRIBE_LOG_LEVEL: INFO
    volumes:
      - piano-scribe-data:/data/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "piano_scribe.worker", "--poll", "2"]
    env_file:
      - path: .env
        required: false
    environment:
      PIANO_SCRIBE_LOG_LEVEL: INFO
    volumes:
      - piano-scribe-data:/data/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from piano_scribe.store import heartbeat_status; raise SystemExit(0 if heartbeat_status(180)['alive'] else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  piano-scribe-data:
