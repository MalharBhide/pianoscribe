# Fly.io deploy: `fly launch` (uses this file), `fly volumes create piano_data`,
# `fly deploy`. One machine runs API + worker together (scripts/start_all.sh)
# because separate processes get separate machines/volumes and the worker
# must share the API's disk.
app = "piano-scribe"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[processes]
  app = "./scripts/start_all.sh"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "piano_data"
  destination = "/data"

[env]
  PIANO_SCRIBE_LOG_LEVEL = "INFO"
  PIANO_SCRIBE_MAX_UPLOAD_MB = "50"
  PIANO_SCRIBE_MAX_DURATION_SEC = "1800"
