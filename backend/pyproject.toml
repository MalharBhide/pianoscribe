[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-scribe"
version = "0.1.0"
description = "Piano Scribe: recordings to readable, editable piano sheet music"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.100",
  "uvicorn[standard]>=0.22",
  "numpy>=1.24",
  "scipy>=1.10",
  "mido>=1.3",
  "reportlab>=3.6,<4",
  "pyyaml>=6.0",
  "python-multipart>=0.0.6",
  "miniaudio>=1.50",
]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]
